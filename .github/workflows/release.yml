name: Release builds
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Configure release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/meowlingo.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/meowlingo.jks" >> "$GITHUB_ENV"
          fi
      - name: Build and test Android
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug
          mkdir -p ../release-assets
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../release-assets/MeowLingo-android.apk
          else
            echo '::warning::No Android release key configured; building a debug-signed APK. Configure signing secrets for stable upgradeable releases.'
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../release-assets/MeowLingo-android-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/*.apk
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify Electron runtime
        if: runner.os == 'macOS'
        run: npm run desktop:smoke
      - run: npm run desktop:make
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p ../release-assets
          find out/make -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -exec sh -c 'cp "$1" "../release-assets/MeowLingo-${{ matrix.platform }}-${{ matrix.arch }}-$(basename "$1")"' _ {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'release'
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Attach files to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
